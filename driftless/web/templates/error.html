{% extends "base.html" %}
{% block title %}Error · Driftless{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl py-16 text-center">
  <div class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-rose-400/10 text-2xl ring-1 ring-rose-400/30">⚠️</div>
  <h1 class="mt-6 text-2xl font-bold text-white">Something went wrong</h1>
  <p class="mt-3 text-slate-400">{{ message | redact }}</p>
  <a href="/" class="mt-8 inline-block text-sm font-medium text-emerald-300 hover:text-emerald-200">← Back to start</a>
</div>
{% endblock %}
