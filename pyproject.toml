[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driftless"
version = "0.1.0"
description = "Docs that never drift. Driftless runs your docs to prove they work."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "debopamghosh12" }]
keywords = ["documentation", "docs", "github", "llm", "pull-requests", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "PyGithub>=2.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlmodel>=0.0.16",
    "openai>=1.30",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/debopamghosh12/driftless"
Source = "https://github.com/debopamghosh12/driftless"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
driftless = "driftless.cli:app"

[tool.setuptools.packages.find]
include = ["driftless*"]

[tool.setuptools.package-data]
driftless = ["prompts/*.txt", "web/templates/*.html", "web/templates/*/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
